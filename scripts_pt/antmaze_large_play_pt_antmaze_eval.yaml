# Production config: round-2 PT BASELINE winner cyrngs49
# (handoff §4.3.108 winners table; regenerated §4.3.137).
# Generated by scripts_bnn/make_production_config.py from the winning
# trial's recorded wandb config, so every value below is what that trial
# RAN, except by design:
#   seed / checkpoints_path / data paths -- set per seed by the launcher.
#   derived fields left null -- TrainConfig.__post_init__ computes them,
#     exactly as it did for the trial.
# No escalation for this family: seed 0 is retrained by train_rewards.sh.
# This file is also the sweep's base config; the sweep overrides every
# field it varied, so editing it does not change a sweep re-run.
# The previous header and values (pre-§3.2.16 winners) are in git history.
#
project: PT-training
group: PT
name: pt
embd_dim: 5   # log2 exponent; round-2 baseline winner cyrngs49 (was 6)
pref_attn_embd_dim: null
head_dim: 3   # log2 exponent; round-2 baseline winner cyrngs49 (was 6)
attn_dropout: 0.1
resid_dropout: 0.1
intermediate_dim: null
num_layers: 2
embd_dropout: 0.1
model_eps: 0.1
max_ep_length: null
default_max_pos: 2048
dataset_id: D4RL_antmaze-large-play-v2
antmaze_variant: antmaze-large-play-v2   # train/val derived from antmaze_variant + seed by the eval script
epochs: 5000
batch_size: 64
lr: 1.67132012995415e-05   # round-2 baseline winner cyrngs49 (was 0.0023041410984674274)
eval_every: 1
criteria_key: loss   # selection criterion on select_split (test); sweep metric eval_loss_at_selected
compile_model: true
pin_memory: true
seed: 1
checkpoints_path: ./exp/reward_learning/antmaze_large_play_pt_eval

# ---- Pinned explicitly for production (handoff §4.3.130) ----
# These were code defaults when cyrngs49 ran.  Written out so the
# production run cannot drift from the selected trial if a
# default ever changes.
bt_pool: mean
num_workers: 4
prefetch_factor: 2
select_split: test