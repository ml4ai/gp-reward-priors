# Production config: NMR stage-1 winner st6m929w
# (handoff §14.14: NMR's stage-1 search, matched to PT's).
# Generated by scripts_bnn/make_production_config.py from the winning
# trial's recorded wandb config, so every value below is what that trial
# RAN, except by design:
#   seed / checkpoints_path / data paths -- set per seed by the launcher.
#   (no derived fields for this family)
# No escalation for this family: seed 0 is retrained by train_rewards.sh.
# This file is also the sweep's base config; the sweep overrides every
# field it varied, so editing it does not change a sweep re-run.
# The previous header (placeholder base config) is in git history.
#
project: NMR-training
group: NMR
name: nmr
embd_dim: 6   # log2 exponent; NMR stage-1 winner st6m929w (was 5)
embd_dropout: 0.1
activations: relu
dataset_id: D4RL_antmaze-large-diverse-v2
antmaze_variant: antmaze-large-diverse-v2   # train/val/test derived from antmaze_variant + seed by the script
epochs: 5000
batch_size: 64
lr: 0.00958389099026606   # NMR stage-1 winner st6m929w (was 0.001)
eval_every: 1
criteria_key: loss   # selection criterion on select_split (test); sweep metric eval_loss_at_selected
compile_model: false
pin_memory: true
seed: 1
checkpoints_path: ./exp/reward_learning/antmaze_large_diverse_nmr_eval

bt_pool: mean
num_workers: 4
prefetch_factor: 2
select_split: test
