project: BNN-training
program: run_bnn_training_antmaze_eval.py
method: bayes
run_cap: 60   # 10 * 5 swept params + 10
metric:
  name: val_mean_cross_entropy
  goal: minimize

# Tier 2 of 2:  warmup -> sampling.  Runs the FULL parallel-chain cyclical
# fSGHMC phase and tunes ONLY the sampler schedule by MINIMIZING the
# posterior-predictive validation cross-entropy (val_mean_cross_entropy).
# Architecture and prior strength are FIXED to the
# sweep_antmaze_large_play_bnn_warmup_antmaze_eval.yaml winner — fill the
# FILL_ME values below before launching (launch_hp_sweeps.sh refuses to run
# phase2 while any FILL_ME remains).
#
# Post-sampler-fix notes:
#   * bt_pool="mean", clip_during_sampling=false, resample_momentum=true ride
#     on the corrected TrainConfig defaults — deliberately not set here.
#   * sghmc_lr / sghmc_lr_max ranges are shifted ~1 decade DOWN from the old
#     sampling sweep (1e-4..3e-3 / 3e-3..3e-2): mean pooling shrinks gradients
#     (v_hat shrinks, minv_t pins at its cap) and medium_play diverges above
#     the ~0.005 lr_max cliff (verified 0.0048 stable / 0.0064 divergent).
#     Ranges must be identical across variants, so the cap applies everywhere.
#     The lr ceiling meets the lr_max floor at 5e-4, so lr_max >= lr_min by
#     construction.  A divergent draw scores poorly rather than crashing
#     (max_param_step=0.5 in the base config is the real blow-up guard).
#   * samples_per_cycle and chain_init_jitter are held at fixed values: their
#     real effects (wall-clock vs tail-ESS; R-hat honesty) are invisible to a
#     val-loss metric, so they are tuned separately with the tail diagnostics
#     (pred_cvar_ess_*, pred_cvar_mcse_rel_*, worst-K) after this sweep.
#   * num_samples is the TOTAL per-chain draw count (post-fix semantics),
#     reached in ceil(num_samples / samples_per_cycle) cycles.
#
# Launch agents from the scripts_bnn/ dir (see launch_hp_sweeps.sh): the
# script os.chdir("..")s to the repo root at import, so config_path and data
# paths are repo-root-relative.
parameters:
  config_path:
    value: "scripts_bnn/antmaze_large_play_bnn_antmaze_eval.yaml"
  seed:
    value: 0

  # Cyclical schedule must be on for sghmc_lr_max / cycle_length /
  # fraction_cool to take effect.
  use_cyclical_lr:
    value: true

  # ---- Per-run budget: 4 chains on a single GPU ----
  num_chains:
    value: 4
  chains_per_gpu:
    value: 4
  num_samples:
    value: 35
  n_discarded:
    value: 2
  num_burn_in_steps:
    value: 5000
  warmup_log_every:
    value: 250

  # ---- New sampler-fix levers held FIXED during this sweep (see notes) ----
  samples_per_cycle:
    value: 1
  chain_init_jitter:
    value: 0.0
  # Fixed burn-in step size, decoupled from the swept cool-phase lr_min
  # (sghmc_lr).  Burn-in inherits lr_min by default, but the sampling-tier
  # lr_min (5e-5-5e-4) is far below the warm-up tier's productive range
  # (1e-4-1e-2), so a fixed-length burn-in under-fits: warm-up accuracy
  # collapses and the gate rejects the very architecture tier-1 selected.
  # This is a design fix (burn-in quality should not be a function of the
  # swept cool-phase step size), not a tuned value.  2e-3 ~ the tier-1
  # winners' sghmc_lr, and is applied UNIFORMLY to every variant.
  burn_in_lr:
    value: 0.002

  # ---- FILLED from the tier-1 (warm-up) winner for this variant ----
  # tier-1 sweep run 3orxv3kl, trial 10, warmup_final_nll=0.227336,
  # warmup_final_acc=0.9074; stopping rule fired at trial 25.
  # width is a log2 exponent (2**width).
  width:
    value: 7
  depth:
    value: 6
  n_meas:
    value: 10
  # Prior amplitude multiplier (K -> amp2*K): tier-1 winner.
  map_amp2:
    value: 623.4845757821569
  # Warm-up gate: DISABLED.  `null` makes the check
  # (`early_stop_acc_threshold is not None and warmup_final_acc < threshold`)
  # unreachable, so every trial runs to completion and is ranked on the
  # pre-registered objective, val_mean_cross_entropy -- no proxy criterion is
  # applied anywhere in the sweep.  A divergent schedule scores poorly rather
  # than crashing; max_param_step (0.5, from the base config) is the real
  # blow-up guard.  Rationale: a gate on warm-up ACCURACY rejects on something
  # other than the selection metric, and because burn-in quality is a function
  # of the swept `mdecay` (friction acts during burn-in as well as sampling),
  # any threshold becomes a hard wall in mdecay -- rejecting schedules for a
  # burn-in reason even when they might sample well.  Letting every trial score
  # lets the objective, not the wall, decide.
  early_stop_acc_threshold:
    value: null

  # ---- Swept: cyclical-SGHMC sampler schedule ----
  # (identical ranges across all antmaze variants)
  # Cool-phase / minimum step size (lr_min).  Ceiling 5e-4 meets sghmc_lr_max's
  # floor so lr_max >= lr_min by construction.
  sghmc_lr:
    distribution: log_uniform_values
    min: 5e-5
    max: 5e-4
  # Hot-phase peak step size (lr_max).  Capped at 5e-3 for the medium_play
  # divergence cliff; centred on the verified-stable 0.0016–0.0032 zone.
  sghmc_lr_max:
    distribution: log_uniform_values
    min: 5e-4
    max: 5e-3
  # Steps per hot+cool cycle.  Cost scales linearly: steps/chain =
  # ceil((num_samples + n_discarded) / samples_per_cycle) * cycle_length.
  cycle_length:
    distribution: q_uniform
    min: 500
    max: 3000
    q: 250
  # Friction: higher mdecay damps hot-phase excursions and shortens the
  # momentum decorrelation length (~1/mdecay steps).
  mdecay:
    distribution: log_uniform_values
    min: 1e-3
    max: 1e-1
  # Fraction of each cycle spent in the cool/sampling tail (was dead pre-fix).
  fraction_cool:
    distribution: uniform
    min: 0.1
    max: 0.5
