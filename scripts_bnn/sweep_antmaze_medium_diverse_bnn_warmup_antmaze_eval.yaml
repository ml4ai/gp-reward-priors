project: BNN-training
program: run_bnn_training_antmaze_eval.py
method: bayes
run_cap: 60   # 10 * 5 swept params + 10
metric:
  name: warmup_final_nll
  goal: minimize

# Tier 1 of 2:  warmup -> sampling.  Post-sampler-fix HP re-selection
# (bt_pool="mean" rescaled the reward, so old optima no longer apply),
# antmaze_eval lineage, seed 0.
#
# Cheaply tunes architecture + functional-prior strength + warm-up sampler
# knobs by MINIMIZING warmup_final_nll (the validation-subsample CE logged
# right after burn-in), BEFORE the expensive parallel-chain phase.  The
# map-informed GP prior's design hyperparameters (map_eta, map_sig_c2,
# map_sig_g2, map_sig_n2) are deliberately NOT swept: they are prior-design
# choices fixed from the maze geometry and the prior-sample diagnostics, never
# selected on downstream return (tuning them on reward would smuggle the
# hidden goal back in).  They are inherited from the base config.  Only n_meas
# (incl. 0 = prior off) is searched, to learn whether and how much the
# map-informed prior helps.
#
# Launch agents from the scripts_bnn/ dir (see launch_hp_sweeps.sh): the
# script os.chdir("..")s to the repo root at import, so config_path and data
# paths are repo-root-relative.
parameters:
  config_path:
    value: "scripts_bnn/antmaze_medium_diverse_bnn_antmaze_eval.yaml"
  seed:
    value: 0

  # ---- Fixed overrides ----
  # warmup_final_nll is logged BEFORE chain sampling, so force every run to
  # stop right after warm-up (accuracy is always < 1.01): this skips the
  # parallel-chain phase entirely — far cheaper sweep runs.
  early_stop_acc_threshold:
    value: 1.01
  # The metric is warm-up NLL; give every run enough burn-in to converge so
  # configs are compared fairly.  These preference sets are small, so a few
  # thousand steps is many epochs.
  num_burn_in_steps:
    value: 5000
  warmup_log_every:
    value: 250

  # ---- Swept: architecture + prior strength + warm-up sampler ----
  # (identical ranges across all antmaze variants)
  # width is a log2 exponent: actual width = 2**width (6 -> 64 ... 10 -> 1024).
  width:
    distribution: int_uniform
    min: 6
    max: 10
  depth:
    distribution: int_uniform
    min: 2
    max: 6
  # n_meas: functional-prior measurement points per step.  0 = prior off, so
  # the optimizer can learn directly whether the map-informed prior helps.
  n_meas:
    distribution: int_uniform
    min: 0
    max: 64
  sghmc_lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  mdecay:
    distribution: log_uniform_values
    min: 1e-3
    max: 1e-1
