project: BNN-training
program: run_bnn_training.py
method: grid
metric:
  name: train_mean_accuracy
  goal: maximize

# Stage 3 of 3:  warmup -> sampling -> sampling_best.
# Multi-seed re-evaluation of the fully-tuned config (architecture + prior from
# sweep_antmaze_large_play_bnn_warmup.yaml, sampler schedule from
# sweep_antmaze_large_play_bnn_sampling.yaml) on the FULL training data
# (training_split=1.0 -> in-sample train_* metrics).  The grid expands to one run
# per seed (10 total) so you get mean +/- std for the chosen config.  Replace
# every PLACEHOLDER with the corresponding winning value.
parameters:
  config_path:
    value: "scripts_bnn/antmaze_large_play_bnn.yaml"

  # Full dataset (no held-out split) + chain sampling -> train_mean_accuracy.
  training_split:
    value: 1.0
  use_cyclical_lr:
    value: true

  # Set low enough that chains run (e.g. 0.0); a high threshold early-stops
  # before any samples are collected and the metric is never logged.
  early_stop_acc_threshold:
    value: 0.0

  # ---- Fixed: architecture + prior from *_warmup winners ----
  num_burn_in_steps:
    value: 5000
  warmup_log_every:
    value: 250
  width:
    value: 7
  depth:
    value: 3
  n_meas:
    value: 26

  # ---- Fixed: sampler schedule from *_sampling winners ----
  sghmc_lr:
    value: 0.0029487209542714563
  sghmc_lr_max:
    value: 0.007164368509688379
  cycle_length:
    value: 2750
  mdecay:
    value: 0.09808239328964724

  # ---- Re-run budget: 8 chains x 310 draws on 6x A6000 (chains_per_gpu=2 ->
  # ceil(8/2)=4 GPUs, 2 chains each, all concurrent).  4x total draws (620->2480)
  # to resolve the worst-case CVaR tail points; watch pred_cvar_* diagnostics. ----
  num_chains:
    value: 8
  num_samples:
    value: 310
  chains_per_gpu:
    value: 2

  # Single best seed (winner of the multi-seed grid) — re-run, not a sweep
  seed:
    value: 8
