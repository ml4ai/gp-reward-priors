# Hyperparameters selected by the ROUND-2 merged BNN sweep (seed-0 data split).
# See HANDOFF_HP_SELECTION.md §3 for the procedure and §3.7 for why round 1 was
# discarded.
#
#   Sweep    BNN-training/bq7ygeqe   metric val_predictive_cross_entropy
#            (Wu et al. 2025 Eq. 10 posterior predictive, E[sigma(f)] — NOT the
#            width-blind plug-in sigma(E[f]); see §3.6.2).
#   Winner   run n1ztawsx, trial 27; stopping rule fired at trial 42.
#            val_predictive_cross_entropy = 0.237685
#            val_predictive_accuracy      = 0.892523
#
#   Acceptance criteria (§3.6.3), all satisfied:
#            fn_drift_loc_z_median   = 1.3408   (<= 2.0)
#            fn_drift_scale_z_median = 1.5125   (<= 2.0)
#            param_clamp_sampling_pct= 1.89e-07   (<= 0.01)
#            gradnorm_sampling_pct_over_clip = 0.00  (reported, not gating)
#   14 of 42 trials up to the trigger were rejected as ineligible (33%).
#
#   NOT selected here: num_chains / chains_per_gpu — stage 3 sets those (§4).
#   num_samples is PINNED at the sweep's 75 draws/chain and is not a free
#   parameter: selection and production must run at the same horizon, which is
#   the round-1 mistake §3.7 exists to prevent.  Buy total draws with chains.
#
#   `burn_in_lr` is deliberately ABSENT — burn-in inherits the swept sghmc_lr.
#   Do not add it back (§3.2).
project: BNN-training
group: BNN
name: bnn

# --- Model architecture ---
width: 10                 # log2 exponent; actual width = 2**width (6 → 64)
depth: 2

# --- Sampling budget (stage 3 decides these; not selected by the sweeps) ---
num_chains: 8             # STAGE 3 SETS THIS — round-1 reference value
chains_per_gpu: 2         # STAGE 3 SETS THIS
num_samples: 75          # PINNED to the sweep horizon (§4) — not a free parameter
n_discarded: 5           # discard first N cycles as extra post-burn-in warm-up
num_burn_in_steps: 20000  # matches the sweep (§3.2)
                         # + per-chain burn-in each run this many steps)

# --- SGHMC core hyperparameters ---
sghmc_lr: 0.00012501907480103085          # lr_min: cool-phase AND burn-in step size
mdecay: 0.007162361949606188             # friction; acts during burn-in as well
                         # sampling (the stage-2 confound, HANDOFF section 7)
batch_size: 64
max_param_step: 0.5      # safety clamp on per-element momentum (null to disable)
n_meas: 17
# Prior amplitude multiplier (K -> map_amp2*K): scales the map kernel's reward
# amplitude while leaving its correlation structure untouched.  Absent this line
# the field falls back to TrainConfig's 1.0, discarding the stage-1 result.
map_amp2: 119680.64191005396
meas_jitter: .000001
gp_cov_scale: 1.0
reward_function: antmaze_task_reward_prior  # source fn in optbnn/gp/reward_functions.py
n_concepts: null         # GP feature dim; null = infer from reward_function

# --- Functional GP prior selection ---
# "lcf" = the LCFModel reward-function prior above (current behaviour).
# "map_informed" = the wall-respecting heat-kernel maze prior; the map_* fields
# below take effect and reward_function/n_concepts/gp_cov_scale are ignored.
gp_prior_type: map_informed
map_size: medium                          # "medium" or "large" (hardcoded fallback layout)
map_env_name: antmaze-medium-diverse-v2   # extract exact layout from this live D4RL env
                                          # (set null to use the hardcoded map_size layout)
map_eta: 1.0             # heat-kernel diffusion time.  Its correlation length is ~1
                         # CELL (r = 0.44 / 0.088 / 0.010 at 1/2/3 hops, both mazes) --
                         # NOT the '2-4 cells' this comment claimed until 2026-08-29
                         # (handoff 4.3.54).  eta=4.0 does deliver 2-4 cells and was
                         # tried; it FAILS the centred 4.2 drift gate on three of four
                         # variants (scale_z 2.64 / 2.39 / 4.79 vs <= 2.0), so 1.0 is
                         # RETAINED -- reverted on stationarity, not on any downstream
                         # metric (handoff 4.3.59, 4.3.60).  The short correlation
                         # length is a known limitation: any cell >=2 hops from data is
                         # effectively prior-only.  Revisit only with a sampler that
                         # stays stationary under the stiffer prior.
map_sig_c2: 1.0          # constant-offset variance (Bradley-Terry additive constant)
map_sig_g2: 1.0          # map-informed signal variance (prior reward scale)
map_sig_n2: 0.001        # nugget / diagonal jitter (mandatory for invertibility)
map_xy_source: obs       # read torso (x,y) from obs[:, :2] (antmaze convention)

# --- Cyclical step-size schedule (Zhang et al. 2020) ---
# Hot phase (lr_max → sghmc_lr, cosine): momentum is RESAMPLED from its
# stationary Gaussian at cycle onset (Wu et al. 2025 Alg. 2), not zeroed —
# zeroing is the legacy resample_momentum=False path and is not what runs.  Cool phase (near sghmc_lr): one sample
# collected at the final step.  The adaptive preconditioner is frozen after
# burn-in, so only lr cycles.
use_cyclical_lr: true
sghmc_lr_max: 0.003993862195442762       # lr_max: hot-phase peak step size
cycle_length: 750       # total steps per cycle (hot + cool)
fraction_cool: 0.12694494991228034   # ~95 cool / ~655 hot steps per cycle

# keep_every is used only when use_cyclical_lr: false
keep_every: 1000

# --- Data ---
antmaze_variant: antmaze-medium-diverse-v2   # train/val derived from antmaze_variant + seed by the eval script
dataset_id: D4RL_antmaze-medium-diverse-v2
measurement_dataset: data/antmaze/antmaze-medium-diverse-v2/antmaze-medium-diverse-v2_tuning_set.hdf5

# --- Warm-up monitoring / early stop ---
warmup_log_every: 250        # eval NLL+acc every N burn-in steps (0 = disabled)
early_stop_acc_threshold: 0.0  # skip chains if warm-up acc below this (null = off)

# --- Misc ---
print_every_n_samples: 10
seed: 1
OUT_DIR: ./exp/reward_learning/antmaze_medium_diverse_bnn_eval
