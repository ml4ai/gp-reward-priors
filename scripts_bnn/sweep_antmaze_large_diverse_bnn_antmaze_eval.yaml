project: BNN-training
program: run_bnn_training_antmaze_eval.py
method: bayes
run_cap: 130   # safety limit only -- the K=15 stopping rule decides (see below)
metric:
  # ROUND 3 (handoff 3.2.1): the objective is CVaR CROSS-ENTROPY, computed from
  # the DEPLOYED conservative reward, at conservatism 0.75 for selection and
  # reported at 0.95 (3.2.10).  Round 2 selected on
  # val_predictive_cross_entropy, a MEAN-based statistic whose ranking
  # correlation with the deployment tail 3.2.3 measured at rho = 0.033 --
  # effectively none -- so it cannot stand as the objective for a method about
  # conservatism.
  #
  # Three GATES apply at WINNER-SELECTION time, not here (a wandb sweep cannot
  # express a gate).  A trial is INELIGIBLE unless all hold:
  #   val_fn_drift_centred_loc_z_median   <= 2.0   (3.6.3 -- centred, NOT raw)
  #   val_fn_drift_centred_scale_z_median <= 2.0
  #   val_cvar_degeneracy_pass            == 1     (3.2.6)
  #   centred ess_bulk                    >= 40    (3.2.1 resolution)
  name: val_cvar_ce
  goal: minimize

# SELECTION METRIC (round 2b): the posterior-predictive cross-entropy of
# Wu et al. (2025) Eq. (10) -- p(y*|x*,D) ~= (1/S) sum_j p(y*|f(x*;w_j)), i.e.
# the LIKELIHOOD averaged over function draws, E[sigma(f)].
#
# NOT `val_mean_cross_entropy`, which averages the reward over draws and
# squashes once, sigma(E[f]).  That plug-in is blind to posterior WIDTH: two
# posteriors with the same mean reward and very different spread score
# identically (measured: holding the mean fixed and inflating the posterior 6x
# moves the plug-in CE by 0.010 and the predictive CE by 0.174).  Selecting on
# a width-blind statistic and then deploying CVaR_0.05 -- a functional of
# exactly that width -- was a misalignment between the procedure and the
# method it is meant to evaluate.  Both are logged; only this one selects.

# ROUND 2 (2026-08-08): a SINGLE merged sweep replacing the round-1 two-tier
# design (warm-up tier -> sampling tier).  Architecture, prior strength and
# sampler schedule are searched together and scored on one metric, exactly as
# the MR and PT baselines are.  See HANDOFF_HP_SELECTION.md section 3.
#
# Why round 1 was discarded (section 3.7): the two tiers were split on the
# assumption that the best architecture is independent of the sampler
# schedule.  It is not.  Tier 1 selected an architecture on `warmup_final_nll`
# with sampling disabled, so it could not see whether that architecture was
# samplable; tier 2 then ran it under a *different* burn-in step size -- a
# fixed burn_in_lr=0.002 standing in for tier 1's own swept value, which for
# this variant was 1.964e-3 (1.0x — essentially matched).  Measured cost to burn-in quality for
# this variant: +22% in warm-up NLL.  The medium_diverse configuration
# selected this way drifted at production length -- weight norm 4.09x over 310
# draws -- while every convergence diagnostic IMPROVED, because a drifting
# chain has a large and growing within-chain variance that pushes R-hat toward
# 1 and inflates ESS.
#
# What merging fixes, structurally rather than by patching:
#   * nothing is inherited between tiers, so no transcription step and no
#     architecture/burn-in mismatch is possible;
#   * `burn_in_lr` is not needed at all -- burn-in inherits the swept
#     `sghmc_lr`, so the configuration being scored is exactly the
#     configuration that will be run;
#   * section 3.5's "residual burn-in/sampling confound" stops being a
#     confound.  Friction acting during burn-in as well as sampling is only a
#     confound when a separately-chosen architecture is being held fixed; here
#     it is simply a property of the candidate under test.
#
# IMPORTANT PRECONDITION: the base config below must NOT set `burn_in_lr`.
# If it does, burn-in silently uses that value instead of the swept
# `sghmc_lr` and the whole point of merging is lost.  A null in the sweep
# cannot fix this -- a wandb agent serialises null onto the command line as
# the string "None", which pyrallis rejects (section 8).  Remove the line.
#
# Launch agents from the scripts_bnn/ dir (see launch_hp_sweeps.sh): the
# script os.chdir("..")s to the repo root at import, so config_path and data
# paths are repo-root-relative.
parameters:
  config_path:
    value: "scripts_bnn/antmaze_large_diverse_bnn_antmaze_eval.yaml"
  seed:
    value: 0

  # ---- Per-trial budget -------------------------------------------------
  # 4 chains on a single GPU, so all four variants' sweeps run concurrently
  # on 4 of leviathan's 6 GPUs under the section 10.7 thread caps.
  # 3.2.8/3.2.9: 32 chains at 8/GPU (4 GPUs), 120k sampling steps
  # (cycle_length 2000 x num_samples 60).  Spends part of 3.2.5's 4.9x SE
  # margin for ~4x throughput; SE 0.0147 stays 1.8x inside the 0.026 needed to
  # separate the top five.
  num_chains:
    value: 32
  # 32, NOT 8: launch_hp_sweeps.sh gives each agent exactly ONE GPU
  # (CUDA_VISIBLE_DEVICES="$gpu"), so 8/GPU would address cuda:0..3 with one
  # device visible and crash at launch.  All 32 chains on one GPU also lets the
  # FOUR variant sweeps run concurrently on 4 of leviathan's 6 GPUs: 2.08x
  # slower per trial than 8/GPU, but 4x the parallelism -- ~1.9x net.
  chains_per_gpu:
    value: 32
  # 75 draws/chain, NOT round 1's 35.  Round 1's horizon was ~1/9 of
  # production, and the failure mode it missed only becomes visible in the
  # metric with length: in the round-1 pilot val CE ran 0.2953 -> 0.3036 ->
  # 0.3411 at 33 / 75 / 150 draws.  35 draws cannot distinguish a drifting
  # configuration from a stable one; 75 can, at ~1/4 the cost of 150.
  #
  # Set the PRODUCTION draws-per-chain to this same 75 and buy total draws
  # with `num_chains` (stage 3, section 4).  Chains do not extend the
  # horizon, so selection and production then run at the same horizon by
  # construction and the round-1 mismatch cannot recur.
  num_samples:
    value: 60
  n_discarded:
    value: 5
  # 20000, NOT round 1's 5000.  Burn-in now runs at the swept `sghmc_lr`,
  # capped at 5e-4, where round 1 used a fixed 2e-3 -- 4x smaller at the
  # ceiling and up to 40x at the floor.  Holding the length fixed while
  # shrinking the step would systematically under-burn every trial, so the
  # length is scaled by the same 4x the ceiling shrank.  This follows from
  # the range construction, not from any observed result.  Deliberately NOT
  # made adaptive to the drawn `sghmc_lr`: burn-in quality is part of the
  # candidate under test, so a configuration needing more burn-in than it
  # gets simply scores worse and the optimiser avoids it.
  num_burn_in_steps:
    value: 20000
  warmup_log_every:
    value: 250

  # Cyclical schedule must be on for sghmc_lr_max / cycle_length /
  # fraction_cool to take effect.
  use_cyclical_lr:
    value: true
  # Held fixed: their real effects (wall-clock vs tail-ESS; R-hat honesty)
  # are invisible to a val-loss metric, so they are set with the tail
  # diagnostics after this sweep, not searched by it.
  samples_per_cycle:
    value: 1
  # NOT decided in 3.2.1 -- set to 1.0 because every stage-3 final and the
  # r3_trial1 probe used it; 0.0 would search a regime stage 3 never validated.
  chain_init_jitter:
    value: 1.0

  # Warm-up gate: DISABLED, as in round 1.  Accuracy is always >= 0, so
  # `warmup_final_acc < 0.0` never fires and every trial runs to completion
  # and is ranked on the pre-registered objective.  0.0 rather than `null`
  # because of the wandb/pyrallis CLI interaction noted above.  See section
  # 3.5 for why the earlier static 0.75 gate was removed.
  # 3.5 removed this in round 1 and 4.3.36 confirmed warm-up quality does not
  # predict final quality.  Do NOT reinstate.
  early_stop_acc_threshold:
    value: 0.0
  # SELECTION conservatism (3.2.10).  Deployment is 0.95, but at this budget
  # (ess_cen ~40) the 0.95 tail holds ~2 EFFECTIVE draws -- few enough to bias
  # the empirical CVaR, which the jackknife SE does not bound.  0.75 holds ~10,
  # the minimum 3.2.1 requires.  3.2.3 measured rho = 0.900 between the two
  # levels with the SAME winner, so the ranking transfers.  0.95 is logged for
  # every trial regardless.
  cvar_ce_conservatism:
    value: 0.75

  # NOTE: `burn_in_lr` is deliberately ABSENT.  Burn-in inherits the swept
  # `sghmc_lr`.  Do not add it back.

  # ---- Swept: architecture ---------------------------------------------
  # width and depth are log2 exponents (2**width).  Ranges UNCHANGED from
  # round 1.  Round-1 tier-1 winner for this variant was width 6, depth 3 —
  # mid-range, no ceiling reached.
  # Ceilings reached in round 1 were reached under `warmup_final_nll`, the
  # metric round 2 retires, so they are not evidence about the optimum under
  # `val_mean_cross_entropy`.  Not narrowed either -- narrowing in response
  # to observed behaviour is what section 9 prohibits.
  # 6-9, not 6-10: MR searches width 6-9 and PT embd_dim 6-8, so 6-10 gave the
  # BNN an octave the baselines never had.  Capping MATCHES MR and strengthens
  # 3.1's invariant that the BNN receive no more tuning than the baselines
  # (3.2.9).  A comparability argument, not a cost one.
  width:
    distribution: int_uniform
    min: 6
    max: 9
  depth:
    distribution: int_uniform
    min: 2
    max: 6

  # ---- Swept: prior strength -------------------------------------------
  # n_meas = 0 disables the functional prior entirely, so the optimiser can
  # reject it outright.  Range unchanged; round-1 winners (10-35) were
  # mid-range.
  # FIXED (3.2.1): 4.3.24 showed n_meas buys prior COVERAGE, not just noise
  # reduction, and 4.3.25 closed the fixed-set alternative with a bound.
  n_meas:
    value: 256
  # Prior amplitude multiplier (K -> map_amp2*K).  EXPANDED 1e3 -> 1e6.
  #
  # Justified by the likelihood, not by observed winners.  Every preference
  # segment is exactly T=100 valid timesteps (verified across all four variants,
  # train and val), so bt_pool="mean" divides the Bradley-Terry logit by exactly
  # 100 relative to the return-based "sum" convention.  Matching that logit scale
  # needs rewards 100x larger; map_amp2 scales the kernel, so reward sd goes as
  # sqrt(map_amp2), and the natural amplitude under mean pooling is therefore
  # ~100^2 = 1e4 times the sum-pooling value.
  #
  # A cap AT the predicted optimum is a cap that binds.  Round 1 (cap 1e3) put
  # all four winners at 313-773; round 2 at cap 1e4 put two leaders at 6647 and
  # 8699.  1e6 leaves two decades of headroom above the predicted scale so the
  # search is not boundary-limited a third time.
  # FIXED (3.2.1): derivable from the pooling convention and T=100 (4.3.16),
  # with 4.3.55's marginal-variance correction.  4.3.16 established it must stop
  # being swept on CE.  The residual ~4x disagreement with medium_play's
  # empirical optimum is disclosed in section 7, not tuned away (4.3.23).
  map_amp2:
    value: 6611

  # ---- Swept: sampler schedule -----------------------------------------
  # Cool-phase / minimum step size (lr_min), and in round 2 also the BURN-IN
  # step size.  Range unchanged at 5e-5-5e-4: its ceiling meets
  # sghmc_lr_max's floor, which is what makes lr_max >= lr_min hold by
  # construction.  Widening it upward would break that invariant.
  sghmc_lr:
    distribution: log_uniform_values
    min: 5e-5
    max: 5e-4
  # Hot-phase peak step size (lr_max).  Cap held at 5e-3: it encodes a
  # MEASURED divergence cliff (stable at 0.0048, divergent at 0.0064 under
  # mean pooling), which is a stability fact rather than a performance
  # result, so keeping it is not reactive tuning.
  sghmc_lr_max:
    distribution: log_uniform_values
    min: 5e-4
    max: 5e-3
  # Steps per hot+cool cycle.  Cost scales linearly:
  # steps/chain = ceil((num_samples + n_discarded) / samples_per_cycle) * cycle_length.
  # FIXED (3.2.1): 4.3.67 measured cycle_length NEUTRAL for decorrelation --
  # that is set by total sampling steps.  Fixed HIGH: extra kept draws are pure
  # memory and jackknife cost at identical statistics.
  cycle_length:
    value: 2000
  # Friction, during burn-in as well as sampling.  EXPANDED 1e-1 -> 1.0:
  # round-1 winners reached 0.0953 (tier-1, medium_diverse) and 0.0892
  # (tier-2, large_diverse), i.e. 89-95% of the old cap, so the optimum
  # plausibly sat outside it.
  mdecay:
    distribution: log_uniform_values
    min: 1e-3
    max: 1.0
  # Fraction of each cycle spent in the cool/sampling tail.
  fraction_cool:
    distribution: uniform
    min: 0.1
    max: 0.5
