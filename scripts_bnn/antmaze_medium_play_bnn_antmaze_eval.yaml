# Production config: ROUND-5 BNN winner ez84hubu (handoff §4.3.130).
# Generated by scripts_bnn/make_production_config.py from the winning
# trial's recorded wandb config, so every value below is what that trial
# RAN, except by design:
#   num_chains 128 / chains_per_gpu 32 -- the §3.2.9 escalation
#     (§4.3.129).  Chains are deterministic in (seed, index), so chains
#     0-31 of a seed-0 run reproduce trial ez84hubu exactly.
#   seed / OUT_DIR / data paths -- set per seed by the launcher.
#   burn_in_lr -- deliberately ABSENT (burn-in inherits sghmc_lr, §3.7).
# This file is also the sweep's base config; the sweep overrides every
# field it varies, so editing it does not change a sweep re-run.
# The previous (round-2 HYBRID) header and values are in git history.
#
project: BNN-training
group: BNN
name: bnn

# --- Model architecture ---
width: 6                 # log2 exponent; actual width = 2**width (6 → 64)
depth: 1   # round-5 winner ez84hubu (was 2)

# --- Sampling budget (stage 3 decides these; not selected by the sweeps) ---
num_chains: 128   # round-5 escalation, §4.3.129 (was 8)
chains_per_gpu: 32   # round-5 escalation, §4.3.129 (was 2)
num_samples: 60   # round-5 winner ez84hubu (was 75)
n_discarded: 5           # discard first N cycles as extra post-burn-in warm-up
num_burn_in_steps: 20000  # matches the sweep (§3.2)
                         # + per-chain burn-in each run this many steps)

# --- SGHMC core hyperparameters ---
sghmc_lr: 0.00012916030293553732   # round-5 winner ez84hubu (was 0.00024896864218544243)
mdecay: 0.8032508754495484   # round-5 winner ez84hubu (was 0.19462287950816173)
                         # sampling (the stage-2 confound, HANDOFF section 7)
batch_size: 64
max_param_step: 0.5      # safety clamp on per-element momentum (null to disable)
# ROUND-3 PINS (§3.2.1).  Round 2 selected n_meas and map_amp2 on predictive CE,
# which drove map_amp2 toward improperness (§4.3.14); round 3 fixes all three.
n_meas: 256              # round-2 winner: 35
# Prior amplitude multiplier (K -> map_amp2*K): scales the map kernel's reward
# amplitude while leaving its correlation structure untouched.  Absent this line
# the field falls back to TrainConfig's 1.0.
map_amp2: 6848           # CORRECTED 2026-09-18 (4.3.109): was 6626, 3.4% low -- 4.3.55's
                         # multiplier was an arithmetic slip; the live-layout value is
                         # 1.4602/1.4624, so T^2/multiplier = 6848. # round-2 winner: 168939.82289052464
chain_init_jitter: 1.0   # round 2 ran the TrainConfig default, 0.0
meas_jitter: .000001
gp_cov_scale: 1.0
reward_function: antmaze_task_reward_prior  # source fn in optbnn/gp/reward_functions.py
n_concepts: null         # GP feature dim; null = infer from reward_function

# --- Functional GP prior selection ---
# "lcf" = the LCFModel reward-function prior above (current behaviour).
# "map_informed" = the wall-respecting heat-kernel maze prior; the map_* fields
# below take effect and reward_function/n_concepts/gp_cov_scale are ignored.
gp_prior_type: map_informed
map_size: medium                          # "medium" or "large" (hardcoded fallback layout)
map_env_name: antmaze-medium-play-v2      # extract exact layout from this live D4RL env
                                          # (set null to use the hardcoded map_size layout)
map_eta: 1.0             # heat-kernel diffusion time.  Its correlation length is ~1
                         # CELL (r = 0.44 / 0.088 / 0.010 at 1/2/3 hops, both mazes) --
                         # NOT the '2-4 cells' this comment claimed until 2026-08-29
                         # (handoff 4.3.54).  eta=4.0 does deliver 2-4 cells and was
                         # tried; it FAILS the centred 4.2 drift gate on three of four
                         # variants (scale_z 2.64 / 2.39 / 4.79 vs <= 2.0), so 1.0 is
                         # RETAINED -- reverted on stationarity, not on any downstream
                         # metric (handoff 4.3.59, 4.3.60).  The short correlation
                         # length is a known limitation: any cell >=2 hops from data is
                         # effectively prior-only.  Revisit only with a sampler that
                         # stays stationary under the stiffer prior.
map_sig_c2: 1.0          # constant-offset variance (Bradley-Terry additive constant)
map_sig_g2: 1.0          # map-informed signal variance (prior reward scale)
map_sig_n2: 0.001        # nugget / diagonal jitter (mandatory for invertibility)
map_xy_source: obs       # read torso (x,y) from obs[:, :2] (antmaze convention)

# --- Cyclical step-size schedule (Zhang et al. 2020) ---
# Hot phase (lr_max → sghmc_lr, cosine): momentum is RESAMPLED from its
# stationary Gaussian at cycle onset (Wu et al. 2025 Alg. 2), not zeroed —
# zeroing is the legacy resample_momentum=False path and is not what runs.  Cool phase (near sghmc_lr): one sample
# collected at the final step.  The adaptive preconditioner is frozen after
# burn-in, so only lr cycles.
use_cyclical_lr: true
sghmc_lr_max: 0.004888507988594456   # round-5 winner ez84hubu (was 0.0008715231030545612)
cycle_length: 2000   # round-5 winner ez84hubu (was 2750)
fraction_cool: 0.25   # round-5 winner ez84hubu (was 0.3369292071925365)

# keep_every is used only when use_cyclical_lr: false
keep_every: 1000

# --- Data ---
antmaze_variant: antmaze-medium-play-v2   # train/val derived from antmaze_variant + seed by the eval script
dataset_id: D4RL_antmaze-medium-play-v2
measurement_dataset: data/antmaze/antmaze-medium-play-v2/antmaze-medium-play-v2_tuning_set.hdf5

# --- Warm-up monitoring / early stop ---
warmup_log_every: 250        # eval NLL+acc every N burn-in steps (0 = disabled)
early_stop_acc_threshold: 0.0  # skip chains if warm-up acc below this (null = off)

# --- Misc ---
print_every_n_samples: 10
seed: 1
OUT_DIR: ./exp/reward_learning/antmaze_medium_play_bnn_eval

# ---- Item F (handoff 4.3.114), round 5 ---------------------------------------
# Centre each posterior draw before the CVaR reduction, so the per-point tail
# selection is driven by the IDENTIFIED reward shape rather than by the draw's
# unidentified additive constant -- which 5.2's gauge overwrites downstream
# anyway.  Measured on ten runs (4.3.113/4.3.114): left raw, the same draws are
# selected at every (s,a), the penalty depth goes near-constant and the CVaR
# reward collapses to `mean - constant`.  Raw CVaR accuracy sat at 0.80-0.92,
# indistinguishable from the mean reward's.
#
# The DEPLOYMENT side must match (iql_eval.py / iql.py, centre_draws), or
# 3.2.1's selection-matches-deployment property breaks.
centre_draws: true


# ---- Pinned explicitly for production (handoff §4.3.130) ----
# These were code defaults when ez84hubu ran.  Written out so the
# production run cannot drift from the selected trial if a
# default ever changes.
bt_pool: mean
clip_during_sampling: false
clip_grad_norm_value: 100.0
cvar_ce_conservatism: 0.75
cvar_ce_conservatism_levels: 0.0,0.5,0.75,0.9,0.95
fix_meas_set: false
log_cvar_ce: true
meas_sampling: random
msd_every: 10
msd_n_points: 256
msd_start: 0
msd_window: 0
resample_momentum: true
samples_per_cycle: 1
transfer_fn: relu
warmup_use_best: false