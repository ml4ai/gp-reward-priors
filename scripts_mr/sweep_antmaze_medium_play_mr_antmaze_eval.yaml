project: MR-training
program: run_mr_training_antmaze_eval.py
method: bayes
run_cap: 130  # matched across model families (see comment below)
metric:
  name: eval_loss_at_selected
  goal: minimize

# UPDATED 2026-09-15 (handoff 4.3.107): the objective is the validation loss AT
# the checkpoint selected on the TEST split (select_split: test, the script
# default) -- no longer the best-over-epochs validation loss.  The comment
# below predates the change.

# Post-sampler-fix HP re-selection (bt_pool="mean" rescaled the reward, so the
# old optima no longer apply), antmaze_eval lineage, seed 0.  Selection
# MINIMIZES the best-over-epochs validation loss: criteria_key=loss makes the
# script track and log eval_loss_best.  seed selects both the model seed and
# the data/antmaze/<variant>/eval/seed_0/ split.  Launch agents from this
# scripts dir (see launch_hp_sweeps.sh): the script os.chdir("..")s to the repo
# root at import, so config_path/data paths are repo-root-relative.
# Trial budget: 130, MATCHED across all model families (MR, PT and BNN; the
# BNN's round-1 two tiers of 70 + 60 are retired).  Rationale: the per-family 10*d+10 rule would give MR 40
# and PT 50 vs the BNN's 130, inviting the objection that the proposed method
# was simply tuned harder than the baselines.  A single shared budget makes the
# comparison auditable ("every family received 130 trials under the same
# stopping rule") and errs toward over-tuning the baselines, which is the safe
# direction.  130 is generous for this family's small search space; the
# adaptive stop below is what actually bounds the spend.
#
# Stopping rule (applied uniformly to every family): stop when the best-so-far
# has not improved for K=15 consecutive trials.  wandb has no built-in
# convergence stop for bayes sweeps, so this is checked out-of-band with
# check_sweep_convergence.py (repo root) and applied by discarding trials after
# the trigger point.  Report BOTH the stopping-rule winner (primary) and
# best-of-all-trials (robustness check); disclose any disagreement.

parameters:
  config_path:
    value: "scripts_mr/antmaze_medium_play_mr_antmaze_eval.yaml"
  seed:
    value: 0
  criteria_key:
    value: "loss"
  epochs:
    value: 5000

  # ---- Swept (identical ranges across all antmaze variants) ----
  # width is a log2 exponent: actual width = 2**width (4 -> 16 ... 7 -> 128).
  # 2026-09-15 (handoff 3.2.16): COMMON CAPACITY RANGES, identical for every
  # variant and matched across families -- MLP width 4-7 x depth 1-4
  # (625-54.5k params, MR and BNN); PT embd_dim 3-5 x num_layers 1-4
  # (2.2k-57.5k).  Chosen for the 254-514 preference labels per variant, on
  # general grounds (data size, HMC mixing vs dimension, a low-dimensional
  # reward), with the ladders and sweeps used only in pooled form.  Replaces
  # width 6-9 / depth 1-6.  A declared section-9 amendment: all sweeps restart
  # from scratch under new id caches.
  width:
    distribution: int_uniform
    min: 4
    max: 7
  depth:
    distribution: int_uniform
    min: 1
    max: 4
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2
