# Production config (REPLICATION, handoff §14.83): MR seed-100 winner uwaasnqh.
# Selected by Study 1's procedure at seed 100 (its ranges, metric, run cap and
# stopping rule).  Generated by scripts_bnn/make_production_config.py --set repl
# from the winning trial's recorded wandb config, so every value below is what
# that trial RAN, except by design:
#   seed / checkpoints_path / data paths -- set per seed by the launcher.
#   (no derived fields for this family)
# Seed 100 is retrained by train_rewards.sh (CONFIG_SET=repl).
# This file is also the seed-100 sweep's base config.
# The previous header (an unselected copy of Study 1's config) is in git history.
#
project: MR-training
group: MR
name: mr
width: 6   # log2 exponent; seed-100 winner uwaasnqh (was 7)
depth: 3   # seed-100 winner uwaasnqh (was 4)
activations: relu
dataset_id: D4RL_antmaze-large-play-v2
antmaze_variant: antmaze-large-play-v2   # train/val derived from antmaze_variant + seed by the eval script
epochs: 5000
batch_size: 64
lr: 0.0008443590121232376   # seed-100 winner uwaasnqh (was 6.370687854353942e-05)
eval_every: 5
criteria_key: loss   # selection criterion on select_split (test); sweep metric eval_loss_at_selected
compile_model: true
pin_memory: true
seed: 1
checkpoints_path: ./exp/reward_learning/antmaze_large_play_mr_eval

# ---- Pinned explicitly for production (handoff §4.3.130) ----
# These were code defaults when c898c0xe ran.  Written out so the
# production run cannot drift from the selected trial if a
# default ever changes.
bt_pool: mean
num_workers: 4
prefetch_factor: 2
select_split: test